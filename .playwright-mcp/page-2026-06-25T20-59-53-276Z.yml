      - generic [ref=e88]:
        - heading "frozen-helix framework" [level=1] [ref=e89]
        - generic [ref=e90]: Local-first · ES modules · No bundler · Static HTML + Node WebSocket
        - paragraph [ref=e91]: A progressive framework for building persistent local-first web apps. Static HTML + vanilla ES modules served directly from Node — no build step, no React, no bundler. Persistence goes through a WebSocket channel to the local filesystem.
        - heading "Architecture" [level=2] [ref=e92]
        - generic [ref=e93]:
          - generic [ref=e94]:
            - link "Item — domain objects" [ref=e95] [cursor=pointer]:
              - /url: /framework/core/Item/
            - paragraph [ref=e96]: Active Record pattern. Wraps a data object with get/set, dirty tracking, async load/save, events, computed fields, schema coercion, and undo/redo. 10 progressive levels (Item0–Item9).
          - generic [ref=e97]:
            - link "List — ordered collections" [ref=e98] [cursor=pointer]:
              - /url: /framework/core/List/
            - paragraph [ref=e99]: The framework's collection primitive. Traversal, add/remove events, derived/filtered/sorted/grouped/indexed views — all reactive. 9 progressive levels (List0–List8).
          - generic [ref=e100]:
            - link "Savers — persistence backends" [ref=e101] [cursor=pointer]:
              - /url: /framework/ext/Saver/
            - paragraph [ref=e102]: "Swappable backends: FileSaver (WebSocket JSON), MemorySaver (tests), LocalStorageSaver (browser), ListSaver (whole list → one file). Item never knows which one is in use."
          - generic [ref=e103]:
            - link "Test — node + browser" [ref=e104] [cursor=pointer]:
              - /url: /framework/core/Test/
            - paragraph [ref=e105]: Test0 runs in Node (no DOM). Test1 adds a browser renderer with collapsible pass/fail trees. Suites attach to their class and inherit lower-level contracts.
        - generic [ref=e106]: "Every class follows the progressive versioning pattern: Item0→Item9, List0→List8. Each level is independently importable and testable. Higher levels extend lower ones but never break the lower-level contract."
