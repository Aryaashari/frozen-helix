        - heading "Savers — persistence backends" [level=2] [ref=e201]
        - paragraph [ref=e202]:
          - text: "All savers implement the same three-method contract:"
          - code [ref=e203]: load(item)
          - text: ","
          - code [ref=e204]: save(item, patch)
          - text: ","
          - code [ref=e205]: delete(item)
          - text: . Set a saver on any Item and children inherit it automatically.
        - generic [ref=e206]:
          - generic [ref=e207]:
            - link "FileSaver" [ref=e208] [cursor=pointer]:
              - /url: /framework/ext/Saver/FileSaver/
            - paragraph [ref=e209]: Writes Item data to a JSON file on the local filesystem via WebSocket RPC. load() uses fetch(). Debounces concurrent writes.
          - generic [ref=e210]:
            - link "ListSaver" [ref=e211] [cursor=pointer]:
              - /url: /framework/ext/Saver/ListSaver/
            - paragraph [ref=e212]: Persists a whole List as a JSON array to one file. load() instantiates each element as an Item. Debounced like FileSaver.
          - generic [ref=e213]:
            - link "LocalStorageSaver" [ref=e214] [cursor=pointer]:
              - /url: /framework/ext/Saver/LocalStorageSaver/
            - paragraph [ref=e215]: Persists Item data to browser localStorage by key. Synchronous. Good for settings and lightweight state.
          - generic [ref=e216]:
            - link "MemorySaver" [ref=e217] [cursor=pointer]:
              - /url: /framework/ext/Saver/MemorySaver/
            - paragraph [ref=e218]: In-memory ephemeral store. Tracks save_count and deleted flag for assertions. Used in all unit tests.
