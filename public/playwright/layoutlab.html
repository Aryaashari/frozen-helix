<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #1b1b19; overflow: hidden; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #d8d8d4; border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #c2c2bd; border: 3px solid transparent; background-clip: content-box; }
  [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(91,87,214,.35); border-radius: 3px; }
</style>
</helmet>
<div style="display:flex; flex-direction:column; height:100vh; width:100vw; background:#f4f4f3;">

  <header style="height:53px; flex:none; display:flex; align-items:center; gap:14px; padding:0 16px; background:#ffffff; border-bottom:1px solid #ececea; z-index:5;">
    <div style="display:flex; align-items:center; gap:9px;">
      <div style="width:22px; height:22px; border-radius:6px; background:#5b57d6; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; padding:4px;">
        <div style="background:rgba(255,255,255,.95); border-radius:1px;"></div>
        <div style="background:rgba(255,255,255,.55); border-radius:1px;"></div>
        <div style="background:rgba(255,255,255,.55); border-radius:1px;"></div>
        <div style="background:rgba(255,255,255,.95); border-radius:1px;"></div>
      </div>
      <span style="font-weight:600; font-size:14.5px; letter-spacing:-0.01em;">Layout&nbsp;Lab</span>
    </div>

    <div style="width:7px; height:14px; transform:skewX(-16deg); border-right:1.5px solid #dededb;"></div>
    {{ docSwitcher }}

    <div style="width:1px; height:24px; background:#ececea; margin:0 2px;"></div>
    {{ deviceToggle }}
    {{ fidelityToggle }}

    <div style="flex:1;"></div>

    {{ themeControl }}
    {{ zoomControl }}
    <div style="width:1px; height:24px; background:#ececea; margin:0 2px;"></div>
    <button onClick="{{ clearAll }}" style="font-family:inherit; font-size:13px; font-weight:500; color:#6b6b66; background:transparent; border:1px solid #e6e6e3; border-radius:8px; padding:7px 12px; cursor:pointer;" style-hover="background:#f6f6f5; color:#1b1b19;">Clear</button>
  </header>

  <div style="flex:1; display:flex; min-height:0;">

    <aside style="width:268px; flex:none; background:#ffffff; border-right:1px solid #ececea; overflow-y:auto; overflow-x:hidden;">
      {{ paletteEl }}
    </aside>

    <main data-ll-canvas="1" style="flex:1; min-width:0; background:#f4f4f3; overflow:auto; position:relative;">
      {{ canvasEl }}
    </main>

    <aside style="width:288px; flex:none; background:#ffffff; border-left:1px solid #ececea; overflow-y:auto; overflow-x:hidden;">
      {{ inspectorEl }}
    </aside>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.themes = {
      indigo:  { accent:'#4f46e5', soft:'#eef2ff', dot:'#4f46e5' },
      emerald: { accent:'#059669', soft:'#ecfdf5', dot:'#059669' },
      rose:    { accent:'#e11d48', soft:'#fff1f2', dot:'#e11d48' },
      amber:   { accent:'#d97706', soft:'#fffbeb', dot:'#d97706' },
      slate:   { accent:'#334155', soft:'#f1f5f9', dot:'#334155' },
    };
    this.CHROME = '#5b57d6';
    this.LIBRARY = [
      { type:'navbar',     label:'Navbar',          cat:'Header',       variants:['Logo + links','Centered','Logo + CTA','With search'] },
      { type:'hero',       label:'Hero',            cat:'Hero',         variants:['Centered','Split right','Image background','Split left'] },
      { type:'features',   label:'Feature grid',    cat:'Content',      variants:['Cards','Icon list','Alternating'], cols:3 },
      { type:'sidebar',    label:'Content + sidebar',cat:'Content',     variants:['Sidebar right','Sidebar left'] },
      { type:'gallery',    label:'Gallery',         cat:'Media',        variants:['Even grid','Mosaic','Row'], cols:3 },
      { type:'pricing',    label:'Pricing',         cat:'Conversion',   variants:['3 tiers','2 tiers','Comparison'] },
      { type:'testimonial',label:'Testimonials',    cat:'Social proof', variants:['Single quote','3 columns','Logo cloud'] },
      { type:'cta',        label:'CTA banner',      cat:'Conversion',   variants:['Centered','Split'] },
      { type:'footer',     label:'Footer',          cat:'Footer',       variants:['4 column','Minimal','Newsletter'] },
    ];
    this.defaults = {
      navbar: { brand:'Acme', l1:'Product', l2:'Features', l3:'Pricing', l4:'Docs', cta:'Get started', search:'Search' },
      hero: { eyebrow:'New', title:'Build something people love', sub:'A short, punchy value proposition that explains what you do — in one calm breath.', b1:'Get started', b2:'Learn more' },
      features: { title:'Everything you need', sub:'Powerful, composable pieces that help your team move faster.',
        f1t:'Fast', f1d:'Lightning quick performance, right out of the box.',
        f2t:'Flexible', f2d:'Bends to whatever workflow you throw at it.',
        f3t:'Reliable', f3d:'Built to scale with quiet confidence.',
        f4t:'Secure', f4d:'Your data stays safe, private, and yours.',
        f5t:'Simple', f5d:'Clean by default, powerful when you need it.',
        f6t:'Open', f6d:'Plays well with the stack you already love.' },
      sidebar: { title:'How it works', p1:'Start with a blank canvas and drag in the pieces you need. Each section is fully editable — change the copy, swap the variant, tune the columns.', p2:'When a layout clicks, save it to your library and reuse it across new pages in a single drag.', s1t:'On this page', s1a:'Getting started', s1b:'Core concepts', s1c:'Examples', s2t:'Resources', s2a:'Documentation', s2b:'Community' },
      gallery: { title:'Selected work' },
      pricing: { title:'Simple, honest pricing', sub:'Start free. Upgrade only when it pays for itself.',
        p1n:'Starter', p1p:'$0', p2n:'Pro', p2p:'$24', p3n:'Team', p3p:'$59' },
      testimonial: { title:'Loved by teams everywhere', quote:'This completely changed how our team ships. We went from weeks of back-and-forth to a layout everyone agreed on in an afternoon.', name:'Alex Rivera', role:'Head of Product, Northwind' },
      cta: { title:'Ready to build your next layout?', sub:'Drag, drop, and ship — no setup required.', b1:'Start free' },
      footer: { brand:'Acme', tagline:'Beautiful layouts, assembled in minutes.', c1:'Product', c2:'Company', c3:'Resources', news:'Get product updates', email:'you@email.com', b1:'Subscribe', copy:'© 2026 Acme, Inc. All rights reserved.' },
    };

    const data = this.loadDocs();
    this.state = {
      docs: data.docs,
      currentId: data.currentId,
      lib: data.lib,
      tree: data.cur.tree,
      device: data.cur.device,
      fidelity: data.cur.fidelity,
      theme: data.cur.theme,
      selected: 'root',
      hoverContainer: null,
      hoverIndex: null,
      menuOpen: false,
      renamingId: null,
      fit: 1,
    };
  }

  // ---------- node model ----------
  rootFrame(children){ return { id:'root', kind:'frame', layout:'flex', dir:'col', gap:0, wrap:false, justify:'start', align:'stretch', gridCols:2, pad:0, bg:'#ffffff', radius:0, w:{mode:'fill'}, h:{mode:'hug'}, children:children||[] }; }
  newFrame(extra){ return Object.assign({ id:this.uid(), kind:'frame', layout:'flex', dir:'col', gap:16, wrap:false, justify:'start', align:'stretch', gridCols:2, pad:16, bg:'transparent', radius:0, w:{mode:'fill'}, h:{mode:'hug'}, children:[] }, extra||{}); }
  seedTree(){
    const secs=['navbar','hero','features','testimonial','cta','footer'].map((t)=>({ id:this.uid(), kind:'section', type:t, variant:0, cols:(this.meta(t).cols||3), content:{}, w:{mode:'fill'}, h:{mode:'hug'} }));
    return this.rootFrame(secs);
  }
  blocksToTree(blocks){
    return this.rootFrame((blocks||[]).map(b=>({ id:b.id||this.uid(), kind:'section', type:b.type, variant:b.variant||0, cols:b.cols||(this.meta(b.type).cols||3), content:b.content||{}, w:{mode:'fill'}, h:{mode:'hug'} })));
  }
  normalizeTree(t){ if(t && t.kind==='frame' && t.children) return t; return this.seedTree(); }

  // ---------- persistence ----------
  loadDocs() {
    let raw=null; try { raw = JSON.parse(localStorage.getItem('layoutlab.v4')); } catch(e){}
    if(raw && raw.docs && raw.docs.length){
      const cur = raw.docs.find(d=>d.id===raw.currentId) || raw.docs[0];
      return { docs:raw.docs, currentId:cur.id, lib:raw.lib||[],
        cur:{ tree:this.normalizeTree(cur.tree), device:cur.device||'desktop', fidelity:cur.fidelity||'styled', theme:cur.theme||'indigo' } };
    }
    // migrate from v3 (flat blocks per doc)
    let v3=null; try{ v3=JSON.parse(localStorage.getItem('layoutlab.v3')); }catch(e){}
    if(v3 && v3.docs && v3.docs.length){
      const docs=v3.docs.map(d=>({ id:d.id, name:d.name, tree:this.blocksToTree(d.blocks), device:d.device||'desktop', fidelity:d.fidelity||'styled', theme:d.theme||'indigo', updatedAt:d.updatedAt||Date.now() }));
      const cur=docs.find(d=>d.id===v3.currentId)||docs[0];
      return { docs, currentId:cur.id, lib:(v3.lib||[]).map(li=>this.libFromV3(li)), cur:{ tree:cur.tree, device:cur.device, fidelity:cur.fidelity, theme:cur.theme } };
    }
    // migrate from v2 (single canvas)
    let old=null; try{ old=JSON.parse(localStorage.getItem('layoutlab.v2')); }catch(e){}
    let tree, dev='desktop', fid='styled', th='indigo', lib=[];
    if(old && old.blocks && old.blocks.length){ tree=this.blocksToTree(old.blocks); dev=old.device||dev; fid=old.fidelity||fid; th=old.theme||th; lib=(old.lib||[]).map(li=>this.libFromV3(li)); }
    else { tree=this.seedTree(); }
    const id='doc'+Date.now().toString(36);
    const docs=[{ id, name:'My first page', tree, device:dev, fidelity:fid, theme:th, updatedAt:Date.now() }];
    return { docs, currentId:id, lib, cur:{ tree, device:dev, fidelity:fid, theme:th } };
  }
  libFromV3(li){ if(li.node) return li; return { id:li.id||this.uid(), name:li.name, node:{ id:this.uid(), kind:'section', type:li.type, variant:li.variant||0, cols:li.cols||3, content:li.content||{}, w:{mode:'fill'}, h:{mode:'hug'} } }; }
  syncCurrent(s){
    return s.docs.map(d => d.id===s.currentId
      ? { ...d, tree:s.tree, device:s.device, fidelity:s.fidelity, theme:s.theme, updatedAt:Date.now() }
      : d);
  }
  persist() {
    const s = this.state;
    try { localStorage.setItem('layoutlab.v4', JSON.stringify({ docs:this.syncCurrent(s), currentId:s.currentId, lib:s.lib })); } catch(e){}
  }
  componentDidUpdate(){ this.persist(); }
  componentDidMount(){
    this.recompute();
    this._onResize = () => this.recompute();
    window.addEventListener('resize', this._onResize);
    this._onDocClick = (e)=>{
      if(!this.state.menuOpen) return;
      const m=document.querySelector('[data-doc-menu]'), b=document.querySelector('[data-doc-btn]');
      if(m && !m.contains(e.target) && b && !b.contains(e.target)) this.setState({ menuOpen:false, renamingId:null });
    };
    document.addEventListener('mousedown', this._onDocClick);
  }
  componentWillUnmount(){ window.removeEventListener('resize', this._onResize); document.removeEventListener('mousedown', this._onDocClick); }

  // ---------- documents ----------
  createDoc(){
    const id='doc'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
    this.setState(s=>{
      const docs=this.syncCurrent(s);
      const n = docs.filter(d=>/^Untitled/.test(d.name)).length;
      docs.push({ id, name:'Untitled'+(n?' '+(n+1):''), tree:this.rootFrame([]), device:'desktop', fidelity:s.fidelity, theme:s.theme, updatedAt:Date.now() });
      return { docs, currentId:id, tree:this.rootFrame([]), device:'desktop', fidelity:s.fidelity, theme:s.theme, selected:'root', hoverContainer:null, hoverIndex:null, menuOpen:false, renamingId:null };
    }, ()=>this.recompute());
  }
  loadDoc(id){
    if(id===this.state.currentId){ this.setState({ menuOpen:false, renamingId:null }); return; }
    this.setState(s=>{
      const docs=this.syncCurrent(s);
      const t=docs.find(d=>d.id===id); if(!t) return { menuOpen:false };
      return { docs, currentId:id, tree:this.normalizeTree(t.tree), device:t.device||'desktop', fidelity:t.fidelity||'styled', theme:t.theme||'indigo', selected:'root', hoverContainer:null, hoverIndex:null, menuOpen:false, renamingId:null };
    }, ()=>this.recompute());
  }
  duplicateDoc(id){
    const nid='doc'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
    this.setState(s=>{
      const docs=this.syncCurrent(s);
      const src=docs.find(d=>d.id===id); if(!src) return {};
      const copy={ ...src, id:nid, name:src.name+' copy', tree:JSON.parse(JSON.stringify(this.normalizeTree(src.tree))), updatedAt:Date.now() };
      const i=docs.findIndex(d=>d.id===id); docs.splice(i+1,0,copy);
      return { docs, currentId:nid, tree:copy.tree, device:copy.device, fidelity:copy.fidelity, theme:copy.theme, selected:'root', hoverContainer:null, hoverIndex:null, renamingId:null };
    }, ()=>this.recompute());
  }
  renameDoc(id,name){ this.setState(s=>({ docs:s.docs.map(d=>d.id===id?{...d,name:(name&&name.trim())||d.name}:d), renamingId:null })); }
  deleteDoc(id){
    this.setState(s=>{
      if(s.docs.length<=1) return {};
      let docs=this.syncCurrent(s).filter(d=>d.id!==id);
      if(id===s.currentId){ const t=docs[0]; return { docs, currentId:t.id, tree:this.normalizeTree(t.tree), device:t.device||'desktop', fidelity:t.fidelity||'styled', theme:t.theme||'indigo', selected:'root', hoverContainer:null, hoverIndex:null, renamingId:null }; }
      return { docs, renamingId:null };
    });
  }
  curDoc(){ return this.state.docs.find(d=>d.id===this.state.currentId) || {}; }
  relTime(ts){ if(!ts) return ''; const d=Math.floor((Date.now()-ts)/1000);
    if(d<60) return 'just now'; if(d<3600) return Math.floor(d/60)+'m ago'; if(d<86400) return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; }
  recompute(){
    const el = document.querySelector('[data-ll-canvas]');
    if (!el) return;
    const fw = this.state.device==='mobile' ? 390 : 1180;
    const avail = el.clientWidth - 80;
    const fit = Math.max(0.34, Math.min(1, avail / fw));
    if (Math.abs(fit - this.state.fit) > 0.005) this.setState({ fit });
  }

  // ---------- helpers ----------
  uid(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
  isWF(){ return this.state.fidelity === 'wireframe'; }
  acc(){ return this.themes[this.state.theme]; }
  c(b,k){ const v = b.content && b.content[k]; return (v===undefined||v===null) ? (this.defaults[b.type]||{})[k] : v; }
  meta(type){ return this.LIBRARY.find(x=>x.type===type) || {}; }
  get mob(){ return this.state.device === 'mobile'; }

  // ---------- tree utilities ----------
  clone(t){ return JSON.parse(JSON.stringify(t)); }
  walk(node, fn, parent){ fn(node, parent); if(node.children) node.children.forEach(c=>this.walk(c, fn, node)); }
  findIn(root, id){ let f=null; this.walk(root, (n)=>{ if(n.id===id) f=n; }); return f; }
  parentIn(root, id){ let p=null; this.walk(root, (n,par)=>{ if(n.id===id) p=par; }); return p; }
  findNode(id){ return this.findIn(this.state.tree, id); }
  parentOf(id){ return this.parentIn(this.state.tree, id); }
  ancestors(id){ const path=[]; let cur=id; const root=this.state.tree;
    while(cur){ const n=this.findIn(root,cur); if(!n) break; path.unshift(n); const p=this.parentIn(root,cur); cur=p?p.id:null; }
    return path; }
  reid(node){ node.id=this.uid(); if(node.children) node.children.forEach(c=>this.reid(c)); return node; }
  mutTree(fn, extra){ this.setState(s=>{ const t=this.clone(s.tree); fn(t); return Object.assign({tree:t}, extra||{}); }); }
  isDescendant(rootNode, id){ let found=false; this.walk(rootNode,(n)=>{ if(n.id===id) found=true; }); return found; }

  // ---------- node operations ----------
  newId(){ return this.uid(); }
  makeNode(d){
    if(d.kind==='sec'){ const m=this.meta(d.type); return { id:this.uid(), kind:'section', type:d.type, variant:0, cols:(m.cols||3), content:{}, w:{mode:'fill'}, h:{mode:'hug'} }; }
    if(d.kind==='lib'){ return this.reid(this.clone(d.item.node)); }
    switch(d.prim){
      case 'frame': return this.newFrame();
      case 'columns': return this.newFrame({ layout:'flex', dir:'row', gap:24, pad:16, children:[ this.newFrame({pad:20,bg:'#f4f4f3',radius:8}), this.newFrame({pad:20,bg:'#f4f4f3',radius:8}) ] });
      case 'text': return { id:this.uid(), kind:'text', text:'Double-click to edit text', size:16, weight:400, color:'#1b1b19', align:'left', w:{mode:'hug'}, h:{mode:'hug'} };
      case 'image': return { id:this.uid(), kind:'image', radius:12, w:{mode:'fill'}, h:{mode:'fixed',px:200} };
    }
    return this.newFrame();
  }
  insertNode(node, parentId, index){
    this.setState(s=>{ const t=this.clone(s.tree); const p=this.findIn(t, parentId); if(!p) return {};
      if(!p.children) p.children=[]; const i = index==null ? p.children.length : Math.max(0, Math.min(p.children.length, index));
      p.children.splice(i, 0, node);
      return { tree:t, selected:node.id, hoverContainer:null, hoverIndex:null };
    });
  }
  moveNode(id, parentId, index){
    if(id===parentId || id==='root') { this.setState({hoverContainer:null,hoverIndex:null}); return; }
    this.setState(s=>{ const t=this.clone(s.tree);
      const moving=this.findIn(t,id); if(!moving) return {hoverContainer:null,hoverIndex:null};
      if(this.isDescendant(moving, parentId)) return {hoverContainer:null,hoverIndex:null};
      const oldP=this.parentIn(t,id); if(!oldP) return {hoverContainer:null,hoverIndex:null};
      const from=oldP.children.findIndex(c=>c.id===id);
      const newP=this.findIn(t,parentId); if(!newP) return {hoverContainer:null,hoverIndex:null}; if(!newP.children) newP.children=[];
      let to = index==null ? newP.children.length : index;
      const [it]=oldP.children.splice(from,1);
      if(oldP===newP && from<to) to--;
      to=Math.max(0, Math.min(newP.children.length, to));
      newP.children.splice(to, 0, it);
      return { tree:t, selected:id, hoverContainer:null, hoverIndex:null };
    });
  }
  removeNode(id){ if(id==='root') return; this.mutTree(t=>{ const p=this.parentIn(t,id); if(p) p.children=p.children.filter(c=>c.id!==id); }, {}); this.setState(s=>({ selected: s.selected===id ? ((this.parentOf(id)||{}).id||'root') : s.selected })); }
  duplicateNode(id){ if(id==='root') return; this.setState(s=>{ const t=this.clone(s.tree); const p=this.parentIn(t,id); if(!p) return {}; const i=p.children.findIndex(c=>c.id===id); const copy=this.reid(this.clone(p.children[i])); p.children.splice(i+1,0,copy); return { tree:t, selected:copy.id }; }); }
  nudge(id,dir){ this.setState(s=>{ const t=this.clone(s.tree); const p=this.parentIn(t,id); if(!p) return {}; const i=p.children.findIndex(c=>c.id===id); const j=i+dir; if(j<0||j>=p.children.length) return {}; const tmp=p.children[i]; p.children[i]=p.children[j]; p.children[j]=tmp; return { tree:t }; }); }
  updateNode(id, patch){ this.mutTree(t=>{ const n=this.findIn(t,id); if(n) Object.assign(n, patch); }); }
  setSize(id, dim, patch){ this.mutTree(t=>{ const n=this.findIn(t,id); if(n) n[dim]=Object.assign({mode:'hug',px:160}, n[dim]||{}, patch); }); }
  setContent(id,k,val){ this.mutTree(t=>{ const n=this.findIn(t,id); if(n) n.content=Object.assign({}, n.content||{}, {[k]:val}); }); }
  setVariant(id,v){ this.updateNode(id,{variant:v}); }
  setCols(id,n){ this.updateNode(id,{cols:n}); }
  clearAll(){ const root=this.state.tree; if(root.children && root.children.length && !confirm('Clear this page?')) return; this.mutTree(t=>{ t.children=[]; }, {selected:'root'}); }
  saveToLib(id){
    const n=this.findNode(id); if(!n) return;
    const dflt = n.kind==='section' ? this.meta(n.type).label : (n.kind==='frame' ? (n.layout==='grid'?'Grid':(n.dir==='row'?'Row group':'Column group')) : (n.kind.charAt(0).toUpperCase()+n.kind.slice(1)));
    const name = prompt('Save to library as:', dflt); if(!name) return;
    const node=this.reid(this.clone(n));
    this.setState(s=>({ lib:[...s.lib, { id:this.uid(), name, node }] }));
  }
  removeLib(id){ this.setState(s=>({ lib:s.lib.filter(x=>x.id!==id) })); }
  addFromPalette(d){ const sel=this.findNode(this.state.selected); const pid=(sel && sel.kind==='frame') ? sel.id : 'root'; this.insertNode(this.makeNode(d), pid, null); }

  // ---------- drag & drop (nesting) ----------
  clearHover(){ if(this.state.hoverContainer!=null) this.setState({hoverContainer:null, hoverIndex:null}); }
  indexInContainer(pnode, containerEl, e){
    const childEls=[...containerEl.children].filter(c=>c.getAttribute && c.getAttribute('data-node-id'));
    const grid = pnode.layout==='grid';
    const row = pnode.layout==='flex' && pnode.dir==='row';
    let idx=childEls.length;
    if(grid){
      for(let i=0;i<childEls.length;i++){ const r=childEls[i].getBoundingClientRect();
        if(e.clientY < r.top - 2){ idx=i; break; }
        if(e.clientY <= r.bottom){ if(e.clientX < r.left + r.width/2){ idx=i; break; } } }
    } else {
      for(let i=0;i<childEls.length;i++){ const r=childEls[i].getBoundingClientRect();
        const mid = row ? r.left + r.width/2 : r.top + r.height/2;
        const pos = row ? e.clientX : e.clientY;
        if(pos < mid){ idx=i; break; } }
    }
    return idx;
  }
  onCanvasOver(e){
    if(!this.drag) return;
    e.preventDefault();
    if(e.dataTransfer){ try{ e.dataTransfer.dropEffect = this.drag.kind==='move' ? 'move' : 'copy'; }catch(x){} }
    let el=document.elementFromPoint(e.clientX, e.clientY);
    let nodeEl = el && el.closest ? el.closest('[data-node-id]') : null;
